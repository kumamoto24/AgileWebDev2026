<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartLink - Profile</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="logo.png">
</head>

<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <main>

    <!-- Profile Section -->
    <section class="profile-section">
      <div class="row g-4 align-items-start">

        <!-- Left: Profile Picture -->
        <div class="col-md-4 profile-picture-area">
          <img 
            src="user_profile.png" 
            alt="Profile picture" 
            class="myprofile-img"
            style="border-radius: 360px;"
          >
        </div>

        <!-- Display Section -->
        <div id="profileDisplay" class="col-md-8 basic-info">
          <h1 id="displayName">Jane Doe</h1>

          <p>
            <strong>Age:</strong>
            <span id="displayAge">24</span>
          </p>

          <p>
            <strong>Location:</strong>
            <span id="displayLocation">Perth, Australia</span>
          </p>

          <p>
            <strong>Interests:</strong>
            <span id="displayInterests">Music, Movies, Fitness, Cooking</span>
          </p>

          <p>
            <strong>Bio:</strong>
            <span id="displayBio">
              I love coffee, music, traveling, and meeting new people!
            </span>
          </p>
        </div>

      </div>
    </section>

    <!-- Story Section -->
    <section class="story-section container mt-5">
      <h1 class="text-center">My Story</h1>

      <div class="row justify-content-center g-4">

        <!-- Card 1 -->
        <div class="col-md-4">
          <div class="card h-100 story-card">
            <img src="beach.jpg" class="card-img-top story-img" alt="Beach Day">
            <div class="card-body text-center">
              <h5 class="card-title story-title">Beach Day</h5>
              <p class="card-text story-description">
                A day at the beach.
              </p>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="col-md-4">
          <div class="card h-100 story-card">
            <img src="coffee.jpg" class="card-img-top story-img" alt="Coffee Date">
            <div class="card-body text-center">
              <h5 class="card-title story-title">Coffee Date</h5>
              <p class="card-text story-description">
                Coffee date vibes.
              </p>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="col-md-4">
          <div class="card h-100 story-card">
            <img src="operahouse.jpg" class="card-img-top story-img" alt="Operahouse">
            <div class="card-body text-center">
              <h5 class="card-title story-title">Operahouse</h5>
              <p class="card-text story-description">
                Operahouse sightseeing.
              </p>
            </div>
          </div>
        </div>

      </div>
    </section>

  </main>

  <script src="index.js"></script>

</body>
</html>
